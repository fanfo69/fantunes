name: Build FanTunes Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get FanTunes custom files
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Get stable Navidrome 0.63.2
        uses: actions/checkout@v4
        with:
          repository: navidrome/navidrome
          ref: v0.63.2
          path: stable

      - name: Apply FanTunes branding and theme
        shell: bash
        run: |
          cp custom/ui/src/themes/fantunes.js stable/ui/src/themes/fantunes.js
          cp custom/ui/src/icons/fantunes-logo.png stable/ui/src/icons/fantunes-logo.png
          cp custom/ui/public/android-chrome-192x192.png stable/ui/public/android-chrome-192x192.png
          cp custom/ui/public/android-chrome-512x512.png stable/ui/public/android-chrome-512x512.png

          python3 <<'PY'
          from pathlib import Path

          # Register FanTunes theme
          p = Path("stable/ui/src/themes/index.js")
          s = p.read_text()

          s = s.replace(
              "import SpotifyTheme from './spotify'\n",
              "import SpotifyTheme from './spotify'\n"
              "import FanTunesTheme from './fantunes'\n"
          )

          s = s.replace(
              "  ExtraDarkTheme,\n  GreenTheme,",
              "  ExtraDarkTheme,\n  FanTunesTheme,\n  GreenTheme,"
          )

          p.write_text(s)

          # Force FanTunes theme for everybody
          p = Path("stable/ui/src/reducers/themeReducer.js")
          p.write_text("export const themeReducer = () => 'FanTunesTheme'\n")

          # Remove user theme selector
          p = Path("stable/ui/src/personal/Personal.jsx")
          s = p.read_text()

          s = s.replace(
              "import { SelectTheme } from './SelectTheme'\n",
              ""
          )

          s = s.replace(
              "        <SelectTheme />\n",
              ""
          )

          s = s.replace(
              "'Navidrome - '",
              "'FanTunes - '"
          )

          p.write_text(s)

          # FanTunes login branding
          p = Path("stable/ui/src/layout/Login.jsx")
          s = p.read_text()

          s = s.replace(
              "import Logo from '../icons/android-icon-192x192.png'",
              "import Logo from '../icons/fantunes-logo.png'"
          )

          old = '''                <a
                  href="https://www.navidrome.org"
                  target="_blank"
                  rel="noopener noreferrer"
                  className={classes.systemNameLink}
                >
                  Navidrome
                </a>'''

          s = s.replace(
              old,
              "                <span>FanTunes</span>"
          )

          s = s.replace(
              "color: '#3f51b5'",
              "color: '#e50914'"
          )

          p.write_text(s)

          # Browser/web-app branding
          p = Path("stable/ui/index.html")
          s = p.read_text()

          s = s.replace(
              "Navidrome Music Server - {{.Version}}",
              "FanTunes Music Server - {{.Version}}"
          )

          s = s.replace(
              '<meta property="og:site_name" content="Navidrome">',
              '<meta property="og:site_name" content="FanTunes">'
          )

          s = s.replace(
              "<title>Navidrome</title>",
              "<title>FanTunes</title>"
          )

          s = s.replace(
              '<meta name="theme-color" content="#ffffff">',
              '<meta name="theme-color" content="#090909">'
          )

          p.write_text(s)
          PY

      - name: Set image name
        id: vars
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fantunes" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish FanTunes
        uses: docker/build-push-action@v6
        with:
          context: ./stable
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_TAG=v0.63.2-fantunes
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:0.63.2
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
